name: Build OMOD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build OMOD with Maven
        run: mvn -B -DskipTests clean package

      - name: Upload OMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: coststructure-omod
          path: |
            omod/target/*.omod
            omod/target/*.jar
          retention-days: 30

      - name: Display build info
        run: |
          echo "Build completed successfully!"
          ls -lh omod/target/*.omod
